<!-- Modèle « Magic Link » de Supabase (Authentication → Emails → Magic Link).
     Sujet : Votre connexion à Recettes familiales -->
<div style="font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #5c707d; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 22px; margin: 0 0 16px;">Recettes familiales</h1>
  <p style="line-height: 1.5; margin: 0 0 24px;">Touchez le bouton pour vous connecter :</p>
  <p style="margin: 0 0 32px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="background: #5c707d; color: #ffffff; text-decoration: none; padding: 14px 22px; border-radius: 12px; font-weight: 600; display: inline-block;">
      Me connecter
    </a>
  </p>
  <p style="line-height: 1.5; margin: 0 0 8px;">Ou saisissez ce code dans l’appli :</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; margin: 0 0 32px;">{{ .Token }}</p>
  <p style="color: #7d735c; font-size: 14px; line-height: 1.5; margin: 0;">
    Le lien et le code sont valables 15 minutes et ne servent qu’une fois.
    Si vous n’avez rien demandé, ignorez cet e-mail.
  </p>
</div>
